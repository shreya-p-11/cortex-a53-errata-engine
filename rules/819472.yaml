id: "819472"
name: Cortex-A53 erratum 819472
description: Store exclusive instructions might cause data corruption due to a race condition with cache maintenance operations.
status: VULNERABLE

structural:
  scope: code
  sequences:
    - name: "cvac_to_poc"
      fix_hint: replace DC CVAC with DC CIVAC
      window: { min: 1, max: 1 }
      steps:
        - mnemonics: [dc]
          op_str: "cvac"
      fix_action:
        type: replace_op_str
        old: "cvac"
        new: "civac"

    - name: "cvau_to_pou"
      fix_hint: replace DC CVAU with DC CIVAC
      window: { min: 1, max: 1 }
      steps:
        - mnemonics: [dc]
          op_str: "cvau"
      fix_action:
        type: replace_op_str
        old: "cvau"
        new: "civac"